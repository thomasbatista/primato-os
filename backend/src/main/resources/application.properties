spring.application.name=PrimatoOsBackend

# Render assigns this dynamically and doesn't always use 8080 — Spring only maps the
# SERVER_PORT env var automatically, not PORT, so this needs an explicit placeholder.
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Supabase's session-mode pooler caps concurrent clients at 15; keep our own pool modest so
# multiple Spring test contexts (e.g. ones with @MockitoBean overrides) can't exhaust it
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

app.bootstrap.manager-name=${BOOTSTRAP_MANAGER_NAME:Administrador}
app.bootstrap.manager-email=${BOOTSTRAP_MANAGER_EMAIL:}
app.bootstrap.manager-password=${BOOTSTRAP_MANAGER_PASSWORD:}

app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key=${R2_ACCESS_KEY:}
app.r2.secret-key=${R2_SECRET_KEY:}
app.r2.bucket-name=${R2_BUCKET_NAME:}
app.r2.public-url=${R2_PUBLIC_URL:}

# raised above the app's own 10MB photo limit so multipart parsing never rejects a request
# before our own validation (in DailyReportService) can return a clean, standard-format 400
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Only health is public (Render's health checker has no JWT) — everything else Actuator
# exposes (env, beans, etc) stays off in production
management.endpoints.web.exposure.include=health
